# The big title of the match end sequence (PT2-7), one line each.
# {name} is the family's display name, upper-cased (the name typed in the lobby,
# or the default from family_names.cfg, e.g. "GREEN FAMILY").
# win  = what the winning family sees, with the winners' name.
# lose = what the losing family sees, with their own name.
win=THE {name} GOT RICH.
lose=THE {name} GOT ROBBED.
